# DESPLEGUE DINÁMICO PENDIENTE (transición Astro/static → Next SSR)
# El deploy FTP estático fue desactivado: el sitio ya no genera ./out/,
# ahora es una app SSR que requiere Node (npm run build → .next/ + npm run start).
# Pendiente: implementar estrategia dinámica (VPS / Docker / Railway / Vercel)
# y documentarla en MIGRACION.md + .opencode/skills/innocaps-deploy.
#
# Mientras tanto, este workflow solo sirve como build de verificación manual.

name: Build (verificación)

on:
  workflow_dispatch:

jobs:
  build-check:
    name: 🟢 Build
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build Project
        run: npm run build
        # Next dinámico: compila a .next/ (sin output "export" → no hay carpeta out)
